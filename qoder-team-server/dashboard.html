<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qoder Team 控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 40px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 {
      text-align: center; font-size: 28px; margin-bottom: 8px;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 40px; }
    .card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
    }
    .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .status-label { font-size: 16px; color: #aaa; }
    .status-badge {
      padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; transition: all 0.3s ease;
    }
    .status-badge.running { background: rgba(0,212,170,0.15); color: #00d4aa; border: 1px solid rgba(0,212,170,0.3); }
    .status-badge.stopped { background: rgba(255,82,82,0.15); color: #ff5252; border: 1px solid rgba(255,82,82,0.3); }
    .btn-group { display: flex; gap: 12px; }
    .btn {
      flex: 1; padding: 14px 24px; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
    .btn-danger { background: linear-gradient(135deg, #ff5252, #c62828); color: #fff; }
    .log-container {
      background: #0d1117; border-radius: 12px; padding: 16px; height: 400px;
      overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.6;
    }
    .log-container::-webkit-scrollbar { width: 6px; }
    .log-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .log-line { padding: 2px 0; word-break: break-all; }
    .log-line.out { color: #79c0ff; }
    .log-line.err { color: #ff7b72; }
    .log-line.info { color: #a5d6ff; }
    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; }
    .info-value { color: #e0e0e0; font-family: monospace; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; transform: translateX(120%); transition: transform 0.3s ease; z-index: 1000; }
    .toast.show { transform: translateX(0); }
    .toast.success { background: rgba(0,212,170,0.9); color: #000; }
    .toast.error { background: rgba(255,82,82,0.9); color: #fff; }
    .footer { text-align: center; margin-top: 30px; color: #555; font-size: 12px; }
    .footer a { color: #00d4ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Qoder Team 控制台</h1>
    <p class="subtitle">后端服务管理面板</p>

    <div class="card">
      <div class="status-row">
        <span class="status-label">服务状态</span>
        <span id="statusBadge" class="status-badge stopped">检查中...</span>
      </div>
      <div class="btn-group">
        <button id="btnStart" class="btn btn-primary" onclick="startServer()">
          <span>▶</span> 启动服务
        </button>
        <button id="btnStop" class="btn btn-danger" onclick="stopServer()">
          <span>■</span> 停止服务
        </button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="font-size:16px;font-weight:600;">服务信息</h3>
        <button class="btn" style="padding:6px 14px;font-size:12px;background:rgba(255,255,255,0.08);" onclick="refreshStatus()">刷新</button>
      </div>
      <div class="info-row">
        <span class="info-label">API 地址</span>
        <span class="info-value"><a href="http://localhost:3000" target="_blank" style="color:#00d4ff;">http://localhost:3000</a></span>
      </div>
      <div class="info-row">
        <span class="info-label">项目路径</span>
        <span class="info-value">qoder-team-server</span>
      </div>
      <div class="info-row">
        <span class="info-label">进程 PID</span>
        <span class="info-value" id="pidValue">-</span>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="font-size:16px;font-weight:600;">应用入口</h3>
      </div>
      <div class="btn-group">
        <a href="http://localhost:5173" target="_blank" class="btn btn-primary" style="text-decoration:none;">
          <span>🚀</span> 打开 Qoder Team 应用
        </a>
      </div>
      <p style="margin-top:12px;font-size:12px;color:#888;">
        前端运行在 localhost:5173，后端 API 在 localhost:3000
      </p>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="font-size:16px;font-weight:600;">实时日志</h3>
        <button class="btn" style="padding:6px 14px;font-size:12px;background:rgba(255,255,255,0.08);" onclick="clearLogs()">清空</button>
      </div>
      <div id="logContainer" class="log-container">
        <div style="color:#555;text-align:center;padding-top:160px;">等待启动...</div>
      </div>
    </div>

    <div class="footer">
      <p>Qoder Team Dashboard - 端口 3457 - <a href="http://localhost:3000" target="_blank">访问 API</a></p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let logBuffer = [];
    let lastLogCount = 0;

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + (type || 'success');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function appendLog(text, type) {
      const container = document.getElementById('logContainer');
      if (container.children.length === 1 && container.children[0].style.color === 'rgb(85, 85, 85)') {
        container.innerHTML = '';
      }
      const div = document.createElement('div');
      div.className = 'log-line ' + (type || 'info');
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function refreshStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const badge = document.getElementById('statusBadge');
        const pidVal = document.getElementById('pidValue');

        if (data.running) {
          badge.className = 'status-badge running';
          badge.textContent = '运行中';
          pidVal.textContent = data.pid || '-';
          document.getElementById('btnStart').disabled = true;
          document.getElementById('btnStop').disabled = false;
        } else {
          badge.className = 'status-badge stopped';
          badge.textContent = '已停止';
          pidVal.textContent = '-';
          document.getElementById('btnStart').disabled = false;
          document.getElementById('btnStop').disabled = true;
        }
      } catch (e) {
        document.getElementById('statusBadge').className = 'status-badge stopped';
        document.getElementById('statusBadge').textContent = '连接失败';
      }
    }

    async function startServer() {
      const btn = document.getElementById('btnStart');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 启动中...';
      appendLog('正在启动后端服务...', 'info');

      try {
        const res = await fetch('/api/start', { method: 'POST' });
        const data = await res.json();
        showToast(data.message || '服务已启动');
        appendLog(data.message || '服务已启动', 'info');
      } catch (e) {
        showToast('启动失败: ' + e.message, 'error');
        appendLog('启动失败: ' + e.message, 'err');
      }

      setTimeout(() => {
        btn.innerHTML = '<span>▶</span> 启动服务';
        refreshStatus();
      }, 2000);
    }

    async function stopServer() {
      const btn = document.getElementById('btnStop');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 停止中...';
      appendLog('正在停止后端服务...', 'info');

      try {
        const res = await fetch('/api/stop', { method: 'POST' });
        const data = await res.json();
        showToast(data.message || '服务已停止');
        appendLog(data.message || '服务已停止', 'info');
      } catch (e) {
        showToast('停止失败: ' + e.message, 'error');
      }

      setTimeout(() => {
        btn.innerHTML = '<span>■</span> 停止服务';
        refreshStatus();
      }, 1500);
    }

    function clearLogs() {
      document.getElementById('logContainer').innerHTML = '<div style="color:#555;text-align:center;padding-top:160px;">日志已清空</div>';
    }

    async function pollLogs() {
      try {
        const res = await fetch('/api/logs');
        const data = await res.json();
        if (data.logs && data.logs.length > lastLogCount) {
          const newLogs = data.logs.slice(lastLogCount);
          newLogs.forEach(line => {
            if (line.includes('[ERR]')) appendLog(line, 'err');
            else if (line.includes('[OUT]')) appendLog(line, 'out');
            else appendLog(line, 'info');
          });
          lastLogCount = data.logs.length;
        }
      } catch (e) {}
    }

    refreshStatus();
    setInterval(() => { refreshStatus(); pollLogs(); }, 1000);
  </script>
</body>
</html>
