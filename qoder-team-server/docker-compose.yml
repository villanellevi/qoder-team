version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qoder
      POSTGRES_PASSWORD: qoder
      POSTGRES_DB: qoder_team
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qoder -d qoder_team"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qoder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
