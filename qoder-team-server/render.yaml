services:
  - type: web
    name: qoder-team-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: qoder-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://qoder-team-demo.vercel.app
    healthCheckPath: /health
    buildCommand: "npx prisma generate"
    startCommand: "npx prisma migrate deploy && node dist/main"

databases:
  - name: qoder-postgres
    plan: standard
    databaseName: qoder_team
    user: qoder
